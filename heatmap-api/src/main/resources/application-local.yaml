spring:
  jpa:
    show-sql: true

app:
  security:
    cookie:
      secure: false
      same-site: Lax
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
      allow-credentials: true

logging:
  level:
    root: INFO
    ru.tbank.tmap: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE