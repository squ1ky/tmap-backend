spring:
  application:
    name: tmap-backend

  profiles:
    default: prod

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null

  # ===== Database =====
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ===== Flyway =====
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ===== Kafka =====
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS}"
    consumer:
      group-id: "${KAFKA_CONSUMER_GROUP}"
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: ru.tbank.tmap.transaction.application.command.TransactionEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "ru.tbank.tmap.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
    listener:
      type: batch
      ack-mode: batch

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s

# ===== Server =====
server:
  port: ${SERVER_PORT:8080}

app:
  security:
    cookie:
      secure: true
      same-site: None
    cors:
      allowed-origin-patterns:
        - "https://tmap.ru"
        - "https://t-map-heatmap.netlify.app"
        - "https://deploy-preview-*--t-map-heatmap.netlify.app"
        - "http://localhost:5173"
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      exposed-headers:
        - Authorization
        - Set-Cookie
      allow-credentials: true
      max-age: 1h
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  aggregation:
    lookback-hours: 1
    initial-delay-ms: 10000
    interval-ms: 60000
  anomaly:
    ratio-threshold: 0.5
    min-baseline: 1
    min-baseline-days: 1
  qr:
    ttl-seconds: 120
  kafka:
    transactions-topic: ${KAFKA_TRANSACTIONS_TOPIC}
  cache:
    enabled: false
  minio:
    endpoint: ${MINIO_ENDPOINT}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
    region: ${MINIO_REGION:us-east-1}

# ===== Swagger =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: db, minio, kafka
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95, 0.99

# ===== Logging =====
logging:
  level:
    root: WARN
    ru.tbank.tmap: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
