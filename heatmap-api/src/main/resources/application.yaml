spring:
  application:
    name: tmap-backend

  profiles:
    default: prod

  # ===== Database =====
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ===== Flyway =====
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ===== Kafka =====
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS}"
    consumer:
      group-id: "${KAFKA_CONSUMER_GROUP}"
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: ru.tbank.tmap.kafka.event.TransactionEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "ru.tbank.tmap.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
    listener:
      type: batch
      ack-mode: batch

# ===== Server =====
server:
  port: ${SERVER_PORT:8080}

# ===== JWT =====
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}
  aggregation:
    lookback-hours: 1
    initial-delay-ms: 10000
    interval-ms: 60000
  kafka:
    transactions-topic: ${KAFKA_TRANSACTIONS_TOPIC}

# ===== Swagger =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

# ===== Logging =====
logging:
  level:
    root: WARN
    ru.tbank.tmap: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
